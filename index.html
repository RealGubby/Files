<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RealGubby - Özel Dosya Sunucusu</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h2 {
      border-bottom: 1px solid #30363d;
      padding-bottom: 12px;
      color: #58a6ff;
    }
    
    /* Şifre Ekranı Tasarımı */
    #auth-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      margin-top: 50px;
      text-align: center;
    }
    input[type="password"] {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 1em;
      outline: none;
      margin-right: 8px;
    }
    input[type="password"]:focus {
      border-color: #58a6ff;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #2ea043;
    }
    #error-msg {
      color: #f85149;
      margin-top: 12px;
      font-size: 0.9em;
      display: none;
    }

    /* Dosya Listesi Tasarımı */
    #content {
      display: none;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #161b22;
      border: 1px solid #30363d;
      margin-bottom: 8px;
      padding: 14px 16px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    li:hover {
      background: #21262d;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    a:hover {
      text-decoration: underline;
    }
    .size {
      color: #8b949e;
      font-size: 0.85em;
    }
    .status {
      color: #8b949e;
      font-style: italic;
    }
    .rar-info {
      background: #161b22;
      border-left: 4px solid #e3b341;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-bottom: 16px;
      color: #d29922;
    }
  </style>
</head>
<body>

  <!-- Şifre Giriş Kutusu -->
  <div id="auth-box">
    🔒 <h3>Erişim Şifresi</h3>
    <form onsubmit="checkPassword(event)">
      <input type="password" id="pass-input" placeholder="Şifreyi giriniz..." required autocomplete="off">
      <button type="submit">Giriş Yap</button>
    </form>
    <div id="error-msg">Hatalı şifre! Lütfen tekrar deneyin.</div>
  </div>

  <!-- Şifre Doğruysa Açılacak İçerik -->
  <div id="content">
    <h2>📦 İndirilebilir Dosya</h2>
    <div class="rar-info">🔑 RAR Dosyası Açılış Şifresi: <strong>Gubby</strong></div>
    <ul id="file-list">
      <li class="status">Dosya kontrol ediliyor...</li>
    </ul>
  </div>

  <script>
    const username = "RealGubby";
    const repo = "Files";
    const targetFile = "Wp_Content.rar"; // Doğrudan ana dizindeki bu dosyayı arayacak

    function checkPassword(event) {
      event.preventDefault();
      const input = document.getElementById("pass-input").value;
      const errorMsg = document.getElementById("error-msg");

      if (input === "Gubby") {
        document.getElementById("auth-box").style.display = "none";
        document.getElementById("content").style.display = "block";
        fetchFiles();
      } else {
        errorMsg.style.display = "block";
        document.getElementById("pass-input").value = "";
      }
    }

    async function fetchFiles() {
      const listElement = document.getElementById("file-list");
      try {
        const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${targetFile}`);
        
        if (!response.ok) {
          throw new Error("'Wp_Content.rar' dosyası ana dizinde bulunamadı.");
        }
        
        const file = await response.json();
        listElement.innerHTML = "";

        const li = document.createElement("li");
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        li.innerHTML = `
          <a href="${file.download_url}" target="_blank" download>🗜️ ${file.name}</a>
          <span class="size">${sizeMB} MB</span>
        `;
        listElement.appendChild(li);

      } catch (err) {
        listElement.innerHTML = `<li style="color: #f85149;">Hata: ${err.message}</li>`;
      }
    }
  </script>
</body>
</html>
